name: Build and Release Plugins

on:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Baixar dependência do dm3270 (Última Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O gh cli vem instalado no ubuntu-latest e permite baixar a última release pública
          gh release download --repo rafarito/dm3270 --pattern "*.jar"
          
          # Salva o nome do arquivo baixado na variável de ambiente
          DM3270_JAR=$(ls dm3270-*.jar | head -n 1)
          echo "DM3270_JAR=${DM3270_JAR}" >> $GITHUB_ENV

      - name: Build Plugins
        run: |
          mkdir -p dist
          for plugin in DownloadDataset FanLogoff FanLogon ShowDataset ShowFields; do
              echo "Building $plugin"
              mkdir -p $plugin/out
              javac -cp "${{ env.DM3270_JAR }}" -d $plugin/out $plugin/src/com/bytezone/plugins/*.java
              jar cvf dist/$plugin.jar -C $plugin/out .
          done
          
      - name: Create Release and Upload JARs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release Plugins ${{ github.ref_name }}
          files: "dist/*.jar"
          generate_release_notes: true
