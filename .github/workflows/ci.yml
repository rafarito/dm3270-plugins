name: Testes

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Os plugins compilam contra o dm3270. Este passo CONSTROI o dm3270 do checkout,
      # e nao baixa o jar da ultima release: enquanto a release fosse a fonte, uma
      # mudanca na API de Plugin so apareceria aqui depois de publicada, e ate la o CI
      # quebraria - ou passaria - por um motivo que nao tem a ver com o commit em teste.
      #
      # A branch e a mesma dos plugins quando ela existe la, e main quando nao existe.
      # Isso e o que permite desenvolver uma mudanca de API nos dois repositorios ao
      # mesmo tempo, com o CI acompanhando o par certo.
      #
      # As coordenadas nao precisam de ajuste: o pom do dm3270 ja declara
      # com.bytezone:dm3270:1.0.0-SNAPSHOT, que e o que este pom pede.
      - name: Construir e instalar a dependencia do dm3270
        run: |
          REPO=https://github.com/rafarito/dm3270.git
          BRANCH="${{ github.head_ref || github.ref_name }}"

          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" > /dev/null 2>&1; then
            echo "dm3270: construindo a partir da branch $BRANCH"
          else
            echo "dm3270: a branch $BRANCH nao existe la, usando main"
            BRANCH=main
          fi

          git clone --depth 1 --branch "$BRANCH" "$REPO" dm3270
          mvn --batch-mode -f dm3270/pom.xml install -DskipTests

      - name: Rodar os testes
        run: mvn --batch-mode test

      - name: Publicar os relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          if-no-files-found: ignore

      # Mutation testing e caro demais para rodar em cada push, mas aqui so um
      # modulo tem testes, entao cabe no mesmo job quando acionado manualmente.
      - name: Rodar o mutation testing
        if: github.event_name == 'workflow_dispatch'
        run: mvn --batch-mode test-compile pitest:mutationCoverage

      - name: Publicar o relatorio de mutacao
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports/'
          if-no-files-found: ignore
